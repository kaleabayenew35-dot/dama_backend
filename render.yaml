services:
  - type: web
    name: dama-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dama-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SYSTEM_BACKEND_URL
        value: https://system-backend-1u5m.onrender.com
      - key: FRONTEND_URL
        value: https://dama-kyw6.onrender.com
      - key: CORS_ORIGINS
        value: https://dama-kyw6.onrender.com,https://system-admin-iou9.onrender.com,https://system-backend-1u5m.onrender.com,http://localhost:3000,http://localhost:5173

databases:
  - name: dama-db
